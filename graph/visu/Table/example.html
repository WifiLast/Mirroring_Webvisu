<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Element Wrapper Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }

        #container {
            width: 100%;
            height: 600px;
            /* Fixed height to test scrolling */
            background: white;
            border: 1px solid #ccc;
        }
    </style>
    <!-- Mock Codesys environment -->
    <script>
        // Mock Grid.js loading if needed, but ElementWrapper handles it.
    </script>
</head>

<body>

    <div id="container"></div>

    <script>
        // Mock ID Generator
        var idGenerator = {
            getId: function () { return "test_table_" + Math.random().toString(36).substr(2, 9); }
        };

        // Load the ElementWrapper script
        // Note: We need to manually load dependencies since we are outside the real WebVisu environment
        // ElementWrapper expects scripts to be relative to itself.
    </script>

    <!-- Load dependencies that ElementWrapper usually finds itself or assumes -->
    <!-- Adjust paths to match your local structure relative to this file -->
    <script src="../ElementWrapper.js"></script>

    <script>
        // Wait for ElementWrapper to be available
        window.addEventListener('load', function () {
            if (typeof TableElementWrapper !== 'undefined') {
                console.log("Initializing TableElementWrapper...");

                var wrapper = new TableElementWrapper(idGenerator);
                // Move the wrapper's domNode into our container
                document.getElementById('container').appendChild(wrapper.domNode);

                // Sample Data
                var sampleData = {
                    ALARMS: [
                        ["Connection Error", "PLANT-001", "EQ-123", 0, "DT#2023-10-27-08:30:00", "ERROR"],
                        ["Warning: High Temp", "PLANT-001", "EQ-124", 45.5, "DT#2023-10-27-08:35:10", "WARNING"],
                        ["System Started", "PLANT-001", "SYSTEM", 1, "DT#2023-10-27-08:00:00", "NOTICE"],
                        ["Voltage Fluctuation", "PLANT-002", "EQ-999", 220, "DT#2023-10-27-09:12:00", "WARNING"],
                        ["Maintenance Required", "PLANT-003", "MAIN-A", 0, "DT#2023-10-27-10:00:00", "NOTICE"],
                        ["Critical Failure", "PLANT-001", "EQ-666", 0, "DT#2023-10-27-11:11:11", "ERROR"],
                        // Generate more data for scrolling
                    ]
                };

                // Add more rows to ensure scrolling works
                for (let i = 0; i < 50; i++) {
                    sampleData.ALARMS.push([
                        `Log Entry ${i}`,
                        `PLANT-00${i % 5}`,
                        `EQ-${1000 + i}`,
                        i * 10,
                        `DT#2023-10-27-12:${(i % 60).toString().padStart(2, '0')}:00`,
                        i % 3 === 0 ? "ERROR" : (i % 3 === 1 ? "WARNING" : "NOTICE")
                    ]);
                }

                console.log("Setting alarms...", sampleData);
                wrapper.setAlarms(JSON.stringify(sampleData));

            } else {
                console.error("TableElementWrapper not found!");
            }
        });
    </script>
</body>

</html>
